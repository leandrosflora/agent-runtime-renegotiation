name: Docs reminder

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for service-code changes
        id: check
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^app/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remind to update docs
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MARKER="<!-- docs-reminder-bot -->"
          BODY="$MARKER
          📚 Este PR muda código deste serviço. Se o comportamento documentado mudou (APIs, eventos, dependências, regras de negócio), atualize [`docs/services/agent-runtime-renegotiation.md`](https://github.com/leandrosflora/conversational-ai-platform-architecture/blob/main/docs/services/agent-runtime-renegotiation.md) em `conversational-ai-demo-arch`.

          _Lembrete automático — não bloqueia o merge._"

          EXISTING=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --jq '.[].body' | grep -c "$MARKER" || true)
          if [ "$EXISTING" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --body "$BODY"
          else
            echo "Already reminded on this PR, skipping."
          fi
